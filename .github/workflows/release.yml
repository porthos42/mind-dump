name: Windows release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=7.1.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build and validate assets
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/Build-Release.ps1 -ExpectedTag $env:RELEASE_TAG -Coverage
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ steps.release.outputs.directory }}/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/*.zip release/*.exe release/SHA256SUMS.txt
          --verify-tag --draft --title "MindDump $RELEASE_TAG"
          --notes-file release/RELEASE-NOTES.md
